name: Deploy to GitHub Pages (optional)

# OPTIONAL static hosting of the Chatss app shell on GitHub Pages.
# Only the application code is published - chats are never uploaded anywhere;
# they stay in each visitor's own browser storage.
#
# One-time setup: repository Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Then run this workflow from the Actions tab.
# It runs only when triggered manually (workflow_dispatch). To deploy on every
# push to main, add `push: branches: [main]` under `on:`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build for the repository subpath
        run: npm run build
        env:
          # e.g. https://<user>.github.io/<repo>/ -> "/<repo>/"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
